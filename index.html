<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>גרעין אהל שלמה – מצמיחים קהילה</title>
  <meta name="description" content="אירועים, חוגים ומשחקייה – גרעין אהל שלמה">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#FAFAF8; --bg2:#F3EDE4; --black:#1A0E06;
      --brown-dark:#4A2010; --brown-mid:#7B3F1A; --brown-warm:#B8621E;
      --gold:#C8882A; --gold-light:#D4A054; --sand:#E8C080; --sand-light:#F0D4A0;
      --text:#2C1A0A; --text-mid:#6B4226; --text-soft:#9A7050;
      --border:rgba(184,98,30,.15); --shadow:0 2px 16px rgba(74,32,16,.1); --shadow-lg:0 8px 40px rgba(74,32,16,.18);
      --gradient:linear-gradient(135deg,#4A2010,#B8621E 45%,#C8882A 75%,#E8C080);
      --radius:14px; --radius-btn:50px; --font:'Heebo',sans-serif; --nav-h:68px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{direction:rtl;scroll-behavior:smooth}
    body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.7;min-height:100vh;overflow-x:hidden}
    a{color:inherit;text-decoration:none} button{font-family:var(--font)} img{max-width:100%;display:block}
    ::-webkit-scrollbar{width:5px} ::-webkit-scrollbar-track{background:var(--bg)} ::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}

    /* ── NAVBAR ── */
    .navbar{position:fixed;top:0;right:0;left:0;z-index:200;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(250,250,248,.94);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
    .nav-brand{display:flex;align-items:center;gap:12px;cursor:pointer;flex-shrink:0}
    .nav-logo{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid rgba(200,136,42,.3);flex-shrink:0}
    .nav-logo-fallback{width:48px;height:48px;border-radius:50%;flex-shrink:0;background:var(--gradient);display:flex;align-items:center;justify-content:center}
    .nav-title{font-size:.98rem;font-weight:800;color:var(--brown-dark);line-height:1.25}
    .nav-slogan{font-size:.67rem;color:var(--gold);font-weight:600}
    .nav-links{display:flex;align-items:center;gap:4px}
    .nav-link{padding:8px 13px;border-radius:var(--radius-btn);font-size:.86rem;font-weight:600;color:var(--text-mid);cursor:pointer;transition:all .22s;border:none;background:none;white-space:nowrap}
    .nav-link:hover,.nav-link.active{background:rgba(200,136,42,.12);color:var(--brown-dark)}
    .nav-link.active{color:var(--gold)}
    .nav-burger{display:none;flex-direction:column;gap:5px;cursor:pointer;background:none;border:none;padding:6px}
    .nav-burger span{display:block;width:24px;height:2px;background:var(--brown-dark);border-radius:2px;transition:all .3s}
    .nav-burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
    .nav-burger.open span:nth-child(2){opacity:0}
    .nav-burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
    .nav-drawer{position:fixed;top:var(--nav-h);right:0;left:0;z-index:199;background:rgba(250,250,248,.98);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 20px 22px;display:none;flex-direction:column;gap:4px;box-shadow:var(--shadow-lg)}
    .nav-drawer.open{display:flex}
    .nav-drawer .nav-link{font-size:.98rem;padding:12px 16px;border-radius:var(--radius);text-align:right}

    /* ── HERO ── */
    .hero{margin-top:var(--nav-h);min-height:52vh;position:relative;overflow:hidden;display:flex;align-items:flex-end}
    .hero-bg{position:absolute;inset:0;background:var(--gradient)}
    .hero-bg img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
    .hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,14,6,.18) 0%,rgba(26,14,6,.72) 100%)}
    .hero-content{position:relative;z-index:1;width:100%;padding:44px 40px 50px;max-width:900px}
    .hero-badge{display:inline-block;font-size:.72rem;letter-spacing:2.5px;font-weight:700;color:var(--sand);background:rgba(26,14,6,.45);border:1px solid rgba(232,192,128,.35);padding:5px 18px;border-radius:var(--radius-btn);margin-bottom:16px;text-transform:uppercase}
    .hero-title{font-size:clamp(2rem,5.5vw,3.6rem);font-weight:900;color:#fff;line-height:1.15;margin-bottom:12px;text-shadow:0 3px 20px rgba(26,14,6,.5)}
    .hero-sub{font-size:1.05rem;color:var(--sand-light);font-weight:400}

    /* ── CAT BAR ── */
    .cat-bar{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:var(--nav-h);z-index:100;box-shadow:0 2px 12px rgba(74,32,16,.07)}
    .cat-tabs{display:flex;align-items:center;max-width:1100px;margin:0 auto;padding:0 24px;overflow-x:auto;scrollbar-width:none}
    .cat-tabs::-webkit-scrollbar{display:none}
    .cat-tab{display:flex;align-items:center;gap:7px;padding:15px 18px;font-size:.88rem;font-weight:600;color:var(--text-soft);cursor:pointer;border:none;background:none;border-bottom:3px solid transparent;transition:all .22s;white-space:nowrap;flex-shrink:0}
    .cat-tab:hover{color:var(--brown-dark)}
    .cat-tab.active{color:var(--gold);border-bottom-color:var(--gold)}

    /* ── PAGES ── */
    .page{display:none} .page.active{display:block}

    /* ── SECTION ── */
    .section{padding:44px 24px 72px;max-width:1100px;margin:0 auto}
    .section-header{display:flex;align-items:center;gap:12px;margin-bottom:30px;padding-bottom:14px;border-bottom:2px solid var(--bg2)}
    .section-title{font-size:1.55rem;font-weight:800;color:var(--brown-dark)}
    .section-count{font-size:.79rem;color:var(--gold);background:rgba(200,136,42,.1);border:1px solid rgba(200,136,42,.25);padding:3px 11px;border-radius:20px;font-weight:600}

    /* ── EVENTS GRID ── */
    .events-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
    .event-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .32s cubic-bezier(.22,.68,0,1.2),box-shadow .32s;box-shadow:var(--shadow)}
    .event-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
    .card-img-wrap{height:200px;overflow:hidden;background:var(--gradient);position:relative}
    .card-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
    .event-card:hover .card-img-wrap img{transform:scale(1.06)}
    .card-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;opacity:.4}
    .card-cat-badge{position:absolute;bottom:10px;right:10px;font-size:.68rem;font-weight:700;letter-spacing:1px;color:#fff;padding:4px 10px;border-radius:20px;text-transform:uppercase}
    .card-closed-badge{position:absolute;top:10px;left:10px;font-size:.68rem;font-weight:700;color:#fff;background:rgba(200,60,60,.85);padding:4px 10px;border-radius:20px}
    .card-body{padding:20px}
    .card-title{font-size:1.1rem;font-weight:800;color:var(--brown-dark);margin-bottom:7px;line-height:1.3}
    .card-desc{font-size:.86rem;color:var(--text-soft);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:14px}
    .card-meta{display:flex;gap:12px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--bg2)}
    .card-meta-item{display:flex;align-items:center;gap:5px;font-size:.77rem;color:var(--text-soft);font-weight:500}
    .empty{grid-column:1/-1;text-align:center;padding:68px 20px;color:var(--text-soft)}
    .empty-icon{font-size:3rem;margin-bottom:14px;opacity:.5}
    .loader{display:flex;align-items:center;justify-content:center;min-height:220px;gap:9px}
    .ld{width:10px;height:10px;border-radius:50%;background:var(--gold);animation:ldp 1.2s ease-in-out infinite}
    .ld:nth-child(2){animation-delay:.2s;background:var(--sand)} .ld:nth-child(3){animation-delay:.4s}
    @keyframes ldp{0%,80%,100%{transform:scale(.6);opacity:.35}40%{transform:scale(1.1);opacity:1}}

    /* ── INFO PAGES ── */
    .info-hero{padding:52px 40px 44px;position:relative;overflow:hidden}
    .info-hero-overlay{position:absolute;inset:0;background:rgba(26,14,6,.45)}
    .info-hero-content{position:relative;z-index:1;max-width:700px}
    .info-hero-title{font-size:clamp(1.8rem,4vw,2.8rem);font-weight:900;color:#fff;margin-bottom:10px}
    .info-hero-sub{font-size:1rem;color:var(--sand-light)}
    .payment-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin-top:32px}
    .payment-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);text-align:center}
    .payment-card-icon{font-size:2.4rem;margin-bottom:12px}
    .payment-card-title{font-size:1.05rem;font-weight:800;color:var(--brown-dark);margin-bottom:6px}
    .payment-card-price{font-size:1.8rem;font-weight:900;color:var(--gold);margin-bottom:4px}
    .payment-card-desc{font-size:.83rem;color:var(--text-soft);margin-bottom:20px}
    .btn-pay-card{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 28px;border:none;border-radius:var(--radius-btn);cursor:pointer;font-weight:700;font-size:.9rem;font-family:var(--font);transition:all .28s;box-shadow:0 4px 18px rgba(0,0,0,.15);width:100%;color:#fff;text-decoration:none}
    .btn-pay-card:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(0,0,0,.22)}

    /* ── CONTACT ── */
    .contact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;margin-top:32px}
    .contact-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:36px 28px;box-shadow:var(--shadow);text-align:center;cursor:pointer;transition:all .28s;display:block;color:inherit}
    .contact-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:rgba(200,136,42,.35)}
    .contact-icon{font-size:3rem;margin-bottom:14px}
    .contact-label{font-size:1rem;font-weight:800;color:var(--brown-dark);margin-bottom:6px}
    .contact-value{font-size:.9rem;color:var(--text-soft)}

    /* ── MODAL ── */
    .modal-bg{position:fixed;inset:0;z-index:300;background:rgba(26,14,6,.55);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s}
    .modal-bg.active{opacity:1;pointer-events:all}
    .modal-sheet{position:fixed;inset:0;z-index:301;overflow-y:auto;display:flex;align-items:flex-start;justify-content:center;pointer-events:none;opacity:0;transition:opacity .3s}
    .modal-sheet.active{opacity:1;pointer-events:all}
    .modal-inner{width:100%;max-width:820px;background:var(--bg);min-height:100vh;transform:translateY(30px);transition:transform .38s cubic-bezier(.22,.68,0,1.2)}
    .modal-sheet.active .modal-inner{transform:translateY(0)}
    .d-hero{height:380px;position:relative;overflow:hidden}
    .d-hero img{width:100%;height:100%;object-fit:cover;filter:brightness(.48) saturate(1.3);transform:scale(1.06)}
    .d-hero-plain{height:380px;background:var(--gradient)}
    .d-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(26,14,6,.15) 0%,rgba(26,14,6,.9) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:40px 36px}
    .d-title{font-size:clamp(1.7rem,4vw,2.6rem);font-weight:900;color:#fff;line-height:1.2;margin-bottom:10px;text-shadow:0 3px 16px rgba(26,14,6,.7)}
    .d-meta{display:flex;gap:16px;flex-wrap:wrap}
    .d-meta-item{display:flex;align-items:center;gap:6px;font-size:.86rem;color:var(--sand-light);font-weight:500}
    .btn-modal-close{position:sticky;top:12px;right:16px;z-index:10;float:left;margin:12px 0 -44px 16px;background:rgba(250,250,248,.92);border:1px solid var(--border);color:var(--brown-dark);width:40px;height:40px;border-radius:50%;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);backdrop-filter:blur(8px);transition:all .22s}
    .btn-modal-close:hover{background:#fff;box-shadow:var(--shadow-lg)}
    .d-body{padding:32px 36px}
    .d-desc{font-size:.97rem;color:var(--text-mid);line-height:1.85;margin-bottom:28px;white-space:pre-wrap}

    /* countdown */
    .cd-box{background:linear-gradient(135deg,rgba(200,136,42,.08),rgba(184,98,30,.04));border:1px solid rgba(200,136,42,.2);border-radius:var(--radius);padding:22px 24px;margin-bottom:22px}
    .cd-label{font-size:.74rem;letter-spacing:2px;color:var(--gold);font-weight:700;text-transform:uppercase;margin-bottom:13px}
    .cd-timer{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
    .cd-unit{text-align:center;flex:1;min-width:0}
    .cd-num{display:block;font-size:clamp(1.3rem,5vw,2.1rem);font-weight:900;color:var(--brown-dark);background:#fff;border:1px solid rgba(200,136,42,.2);border-radius:9px;padding:8px 4px;line-height:1}
    .cd-word{display:block;font-size:.6rem;color:var(--text-soft);margin-top:5px;font-weight:600;letter-spacing:.5px}
    .cd-sep{font-size:1.5rem;color:var(--gold);font-weight:900;flex-shrink:0;margin-top:-8px}
    .cd-closed{text-align:center;color:#c0392b;font-size:.95rem;font-weight:700;padding:14px;background:rgba(200,60,60,.07);border-radius:9px;border:1px solid rgba(200,60,60,.2)}

    /* calc */
    .calc-box{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;box-shadow:var(--shadow)}
    .calc-title{font-size:1rem;font-weight:800;color:var(--brown-dark);margin-bottom:16px}
    .calc-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
    .calc-field{flex:1;min-width:140px}
    .calc-field label{display:block;font-size:.78rem;color:var(--text-soft);font-weight:600;margin-bottom:7px}
    .calc-field-row{display:flex;align-items:center}
    .calc-btn{background:rgba(200,136,42,.1);border:1px solid rgba(200,136,42,.3);color:var(--gold);font-size:1.1rem;width:38px;height:42px;cursor:pointer;transition:background .2s;flex-shrink:0}
    .calc-btn:first-child{border-radius:8px 0 0 8px} .calc-btn:last-child{border-radius:0 8px 8px 0}
    .calc-btn:hover{background:rgba(200,136,42,.25)}
    .calc-input{width:56px;height:42px;text-align:center;font-family:var(--font);font-size:1rem;font-weight:700;background:var(--bg);border:1px solid rgba(200,136,42,.25);border-right:none;border-left:none;color:var(--text);outline:none}
    .calc-total{border-top:1px solid var(--bg2);padding-top:15px;display:flex;align-items:baseline;justify-content:space-between}
    .calc-total-label{font-size:.9rem;color:var(--text-soft);font-weight:600}
    .calc-total-amt{font-size:2rem;font-weight:900;color:var(--brown-dark)}

    /* pay buttons */
    .pay-buttons{display:flex;flex-direction:column;gap:11px;margin-bottom:22px}
    .btn-pay{display:flex;align-items:center;justify-content:center;gap:9px;padding:16px 28px;background:var(--gradient);color:var(--black);font-weight:800;font-size:1rem;font-family:var(--font);border:none;border-radius:var(--radius-btn);cursor:pointer;transition:all .28s;box-shadow:0 5px 22px rgba(200,136,42,.38);text-decoration:none}
    .btn-pay:hover{transform:translateY(-2px);box-shadow:0 9px 30px rgba(200,136,42,.55)}
    .btn-pay.disabled{background:rgba(180,160,130,.28);color:rgba(100,80,50,.4);box-shadow:none;pointer-events:none}
    .btn-pay-alt{background:#fff;border:2px solid var(--gold);color:var(--brown-dark);box-shadow:0 3px 14px rgba(200,136,42,.2)}
    .btn-pay-alt:hover{background:rgba(200,136,42,.07);box-shadow:0 6px 22px rgba(200,136,42,.35)}

    /* poster */
    .poster-wrap{padding:0 36px 36px}
    .poster-label{font-size:.74rem;color:var(--text-soft);font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
    .poster-thumb{border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);cursor:zoom-in;transition:all .28s}
    .poster-thumb:hover{border-color:rgba(200,136,42,.4);transform:scale(1.005)}
    .poster-thumb img{width:100%}

    /* lightbox */
    .lightbox{position:fixed;inset:0;z-index:500;background:rgba(26,14,6,.97);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .28s}
    .lightbox.active{opacity:1;pointer-events:all}
    .lightbox img{max-width:94vw;max-height:92vh;border-radius:var(--radius);object-fit:contain}
    .lb-close{position:absolute;top:18px;right:18px;background:rgba(250,250,248,.15);border:1px solid rgba(250,250,248,.25);color:#fff;width:44px;height:44px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
    .lb-close:hover{background:rgba(250,250,248,.25)}

    /* toast */
    .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(80px);background:rgba(26,14,6,.94);border:1px solid rgba(200,136,42,.35);color:#fff;font-size:.9rem;font-weight:600;padding:13px 26px;border-radius:var(--radius-btn);z-index:600;transition:transform .35s cubic-bezier(.22,.68,0,1.2);white-space:nowrap;backdrop-filter:blur(16px)}
    .toast.show{transform:translateX(-50%) translateY(0)}

    /* responsive */
    @media(max-width:768px){
      .nav-links{display:none} .nav-burger{display:flex}
      .hero-content{padding:32px 20px 42px}
      .d-body{padding:22px 20px} .d-overlay{padding:22px 20px}
      .poster-wrap{padding:0 20px 28px}
      .section{padding:32px 16px 56px}
      .info-hero{padding:40px 20px 36px}
      /* Countdown single line on mobile */
      .cd-timer{gap:5px}
      .cd-num{font-size:1.25rem;padding:7px 3px;border-radius:7px}
      .cd-word{font-size:.56rem}
      .cd-sep{font-size:1.2rem}
    }
    @media(min-width:769px){.nav-burger{display:none}}
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="nav-brand" onclick="showPage('events')">
    <div id="nav-logo-wrap">
      <div class="nav-logo-fallback" id="nav-logo-fallback">
        <svg width="26" height="26" viewBox="0 0 60 60" fill="none"><ellipse cx="30" cy="36" rx="26" ry="20" fill="#E8C080"/><ellipse cx="30" cy="43" rx="26" ry="13" fill="#C8882A"/><ellipse cx="30" cy="50" rx="26" ry="8" fill="#7B3F1A"/><rect x="4" y="18" width="52" height="22" fill="#FDF9F4" rx="2"/><ellipse cx="30" cy="36" rx="26" ry="20" fill="none" stroke="#4A2010" stroke-width="1.5"/><g fill="#4A2010"><ellipse cx="22" cy="28" rx="3" ry="3"/><rect x="19" y="31" width="6" height="10" rx="2"/><ellipse cx="38" cy="29" rx="2.5" ry="2.5"/><rect x="36" y="32" width="5" height="9" rx="2"/><ellipse cx="30" cy="30" rx="2" ry="2"/><rect x="28.2" y="32" width="3.5" height="8" rx="1.5"/></g></svg>
      </div>
    </div>
    <div>
      <div class="nav-title" id="nav-org-name">גרעין אהל שלמה</div>
      <div class="nav-slogan">מצמיחים קהילה</div>
    </div>
  </div>
  <div class="nav-links">
    <button class="nav-link active" data-page="events"      onclick="showPage('events',this)">🗓️ אירועים</button>
    <button class="nav-link"       data-page="playground"   onclick="showPage('playground',this)">🎠 משחקייה</button>
    <button class="nav-link"       data-page="classes"      onclick="showPage('classes',this)">🎨 חוגים</button>
    <button class="nav-link"       data-page="contact"      onclick="showPage('contact',this)">📞 יצירת קשר</button>
  </div>
  <button class="nav-burger" id="nav-burger" aria-label="תפריט"><span></span><span></span><span></span></button>
</nav>

<!-- Mobile drawer -->
<div class="nav-drawer" id="nav-drawer">
  <button class="nav-link" data-page="events"     onclick="showPage('events',this);closeDrawer()">🗓️ אירועים</button>
  <button class="nav-link" data-page="playground" onclick="showPage('playground',this);closeDrawer()">🎠 משחקייה</button>
  <button class="nav-link" data-page="classes"    onclick="showPage('classes',this);closeDrawer()">🎨 חוגים</button>
  <button class="nav-link" data-page="contact"    onclick="showPage('contact',this);closeDrawer()">📞 יצירת קשר</button>
</div>

<!-- HERO -->
<header class="hero">
  <div class="hero-bg" id="hero-bg"></div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <span class="hero-badge">✦ קהילה · אמונה · שייכות ✦</span>
    <h1 class="hero-title">אירועי הקהילה שלנו</h1>
    <p class="hero-sub">כל הפעילויות, ימי עיון ואירועים משפחתיים במקום אחד</p>
  </div>
</header>

    <div class="events-grid" id="events-grid">

    <div class="info-hero-content"><h2 class="info-hero-title">🎠 משחקייה</h2><p class="info-hero-sub">תשלומי משחקייה קהילתית</p></div>
  </div>
  <div class="section">
    <div id="playground-cards" class="payment-cards">
      <div class="loader"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>

<!-- PAGE: CLASSES -->
<div class="page" id="page-classes">
  <div class="info-hero" style="background:linear-gradient(135deg,#1a3a6b,#2d5aa0,#4a7fd4)">
    <div class="info-hero-overlay"></div>
    <div class="info-hero-content"><h2 class="info-hero-title">🎨 חוגים</h2><p class="info-hero-sub">תשלומי חוגים ופעילויות העשרה</p></div>
  </div>
  <div class="section">

<div class="page" id="page-contact">
  <div class="info-hero" style="background:var(--gradient)">

    <div class="info-hero-content"><h2 class="info-hero-title">📞 יצירת קשר</h2><p class="info-hero-sub">אנחנו כאן בשבילכם</p></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- ══════════════════════════════════════════
     FIREBASE + LOGIC
══════════════════════════════════════════ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAnalytics }  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
  import { getFirestore, collection, getDocs, doc, getDoc, query, orderBy }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey:"AIzaSyDXfQR-0pI5uRsSQpwPJ0u3uwJE2paYdEY",
    authDomain:"osevents-4fbd2.firebaseapp.com",
    projectId:"osevents-4fbd2",
    storageBucket:"osevents-4fbd2.firebasestorage.app",
    messagingSenderId:"1094502920714",
    appId:"1:1094502920714:web:35c52532d635e2353c25f3",
    measurementId:"G-18Z8BFWKH9"
  };
  const app = initializeApp(firebaseConfig);
  getAnalytics(app);
  const db = getFirestore(app);

  const eventsGrid  = document.getElementById('events-grid');
  const eventsCount = document.getElementById('events-count');
  const modalBg     = document.getElementById('modal-bg');
  const modalSheet  = document.getElementById('modal-sheet');
  const modalInner  = document.getElementById('modal-inner');
  const lightbox    = document.getElementById('lightbox');
  const lbImg       = document.getElementById('lb-img');
  const toastEl     = document.getElementById('toast');

  let allEvents = [], cdInterval = null, currentCat = 'all', settings = {};

  /* ── SETTINGS ── */
  async function loadSettings() {
    try {
      const snap = await getDoc(doc(db,'settings','main'));
      if (snap.exists()) { settings = snap.data(); applySettings(); }
    } catch(e) { console.warn('no settings', e); }
  }

  function applySettings() {
    if (settings.orgName) document.getElementById('nav-org-name').textContent = settings.orgName;
    if (settings.logoUrl) {
      document.getElementById('nav-logo-wrap').innerHTML =
        `<img class="nav-logo" src="${settings.logoUrl}" alt="לוגו" onerror="this.style.display='none'">`;
    }
    if (settings.heroBgUrl) {
      document.getElementById('hero-bg').innerHTML =
        `<img src="${settings.heroBgUrl}" alt="" onerror="this.remove()">`;
    }
    renderContact();
    if (settings.playgroundItems) renderPayPage('playground-cards', settings.playgroundItems, '#3d8a3d');
    if (settings.classItems)      renderPayPage('classes-cards',    settings.classItems,      '#2d5aa0');
  }

  function renderContact() {
    const grid = document.getElementById('contact-grid');
    const ph   = settings.phone     || '';
    const wa   = settings.whatsapp  || ph;
    if (!ph && !wa) { grid.innerHTML='<p style="color:var(--text-soft);padding:40px 0">פרטי קשר לא הוגדרו</p>'; return; }
    const waNum = '972' + (wa||'').replace(/^0/,'').replace(/\D/g,'');
    grid.innerHTML = `
      ${ph ? `<a class="contact-card" href="tel:${ph.replace(/\D/g,'')}"><div class="contact-icon">📞</div><div class="contact-label">שיחת טלפון</div><div class="contact-value">${ph}</div></a>` : ''}
      ${wa ? `<a class="contact-card" href="https://wa.me/${waNum}" target="_blank" rel="noopener"><div class="contact-icon">💬</div><div class="contact-label">WhatsApp</div><div class="contact-value">${wa}</div></a>` : ''}`;
  }

  function renderPayPage(id, items, color) {
    const el = document.getElementById(id);
    if (!items||!items.length) { el.innerHTML='<p style="color:var(--text-soft);text-align:center;padding:48px">אין פריטים עדיין</p>'; return; }
    el.innerHTML = items.map(item => `
      <div class="payment-card">
        <div class="payment-card-icon">${item.icon||'💳'}</div>
        <div class="payment-card-title">${item.title}</div>
        <div class="payment-card-price">₪${item.price}</div>
        <div class="payment-card-desc">${item.desc||''}</div>
        <a class="btn-pay-card" href="${item.link}" target="_blank" rel="noopener" style="background:${color}">לתשלום ›</a>
      </div>`).join('');
  }

  /* ── EVENTS ── */
  async function loadEvents() {
    eventsGrid.innerHTML = `<div class="loader"><div class="ld"></div><div class="ld"></div><div class="ld"></div></div>`;
    try {
      const q    = query(collection(db,'events'), orderBy('createdAt','desc'));
      const snap = await getDocs(q);
      allEvents  = snap.docs.map(d=>({id:d.id,...d.data()}));
      renderCards(currentCat);
    } catch(e) {
      eventsGrid.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><p>שגיאה בטעינת האירועים</p></div>';
      console.error(e);
    }
  }

  /* CATEGORY TABS */
  document.querySelectorAll('.cat-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      currentCat = tab.dataset.cat;
      renderCards(currentCat);
    });
  });

  const catLabelMap  = {events:'במעגל השנה',playground:'משחקייה',classes:'חוגים'};
  const catColorMap  = {events:'#C8882Acc',playground:'#3d8a3dcc',classes:'#2d5aa0cc'};

  function getDeadline(ev) {
    if (!ev.registrationDeadline) return null;
    return ev.registrationDeadline?.toDate ? ev.registrationDeadline.toDate() : new Date(ev.registrationDeadline);
  }
  function isClosed(ev){ const d=getDeadline(ev); return d&&!isNaN(d)&&d<=new Date(); }

  function renderCards(cat) {
    const list = cat==='all' ? allEvents : allEvents.filter(ev=>(ev.category||'events')===cat);
    eventsCount.textContent = list.length;
    if (!list.length) { eventsGrid.innerHTML='<div class="empty"><div class="empty-icon">🗓️</div><p>אין אירועים בקטגוריה זו</p></div>'; return; }
    eventsGrid.innerHTML = list.map(ev => {
      const d      = getDeadline(ev);
      const ds     = d&&!isNaN(d)?d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'}):'';
      const closed = isClosed(ev);
      const catKey = ev.category||'events';
      return `
      <article class="event-card" data-id="${ev.id}" role="button" tabindex="0">
        <div class="card-img-wrap">
          ${ev.imageUrl?`<img src="${ev.imageUrl}" alt="${ev.title}" loading="lazy">`:`<div class="card-ph"><svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="rgba(200,136,42,.4)"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></div>`}
          <span class="card-cat-badge" style="background:${catColorMap[catKey]||catColorMap.events}">${catLabelMap[catKey]||catKey}</span>
          ${closed?'<span class="card-closed-badge">⛔ הרשמה סגורה</span>':''}
        </div>
        <div class="card-body">
          <h3 class="card-title">${ev.title}</h3>
          <p class="card-desc">${ev.description||''}</p>
          <div class="card-meta">
            ${ds?`<span class="card-meta-item"><svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>${ds}</span>`:''}
            <span class="card-meta-item"><svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>מבוגר ₪${ev.priceAdult||0} | ילד ₪${ev.priceChild||0}</span>
          </div>
        </div>
      </article>`;
    }).join('');
    document.querySelectorAll('.event-card').forEach(c=>c.addEventListener('click',()=>openDetail(c.dataset.id)));
  }

  /* ── DETAIL ── */
  function openDetail(id) {
    const ev = allEvents.find(e=>e.id===id);
    if (!ev) return;
    clearInterval(cdInterval);
    const d = getDeadline(ev);
    const closed = isClosed(ev);

    /* build all pay buttons */
    const allBtns = [];
    if (ev.paymentLink) allBtns.push({label:ev.paymentLabel||'לתשלום מאובטח', url:ev.paymentLink, alt:false});
    if (ev.paymentButtons?.length) ev.paymentButtons.forEach(b=>allBtns.push({label:b.label,url:b.url,alt:true}));

    const payHTML = allBtns.length ? `<div class="pay-buttons">${allBtns.map(b=>`
      <a class="btn-pay ${b.alt?'btn-pay-alt':''} ${closed?'disabled':''}"
         href="${closed?'#':b.url}" target="${closed?'_self':'_blank'}" rel="noopener">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
        ${b.label}
      </a>`).join('')}</div>` : '';

    modalInner.innerHTML = `
      <button class="btn-modal-close" id="btn-close">✕</button>
      <div class="d-hero">
        ${ev.imageUrl?`<img src="${ev.imageUrl}" alt="${ev.title}">`:'<div class="d-hero-plain"></div>'}
        <div class="d-overlay">
          <h1 class="d-title">${ev.title}</h1>
          <div class="d-meta">
            ${d&&!isNaN(d)?`<span class="d-meta-item"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>הרשמה עד ${d.toLocaleDateString('he-IL')}</span>`:''}
            <span class="d-meta-item"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>מבוגר ₪${ev.priceAdult||0} | ילד ₪${ev.priceChild||0}</span>
          </div>
        </div>
      </div>
      <div class="d-body">
        ${ev.description?`<p class="d-desc">${ev.description}</p>`:''}
        <div class="cd-box">
          <div class="cd-label">⏳ זמן שנותר להרשמה</div>
          <div id="cd-inner"></div>
        </div>
        <div class="calc-box">
          <h3 class="calc-title">🧮 מחשבון מחיר</h3>
          <div class="calc-row">
            <div class="calc-field">
              <label>מבוגרים (₪${ev.priceAdult||0})</label>
              <div class="calc-field-row"><button class="calc-btn" id="da">−</button><input class="calc-input" id="ia" type="number" value="0" min="0" readonly><button class="calc-btn" id="ia2">+</button></div>
            </div>
            <div class="calc-field">
              <label>ילדים (₪${ev.priceChild||0})</label>
              <div class="calc-field-row"><button class="calc-btn" id="dc">−</button><input class="calc-input" id="ic" type="number" value="0" min="0" readonly><button class="calc-btn" id="ic2">+</button></div>
            </div>
          </div>
          <div class="calc-total"><span class="calc-total-label">סה"כ לתשלום</span><span class="calc-total-amt">₪<span id="tot">0</span></span></div>
        </div>
        ${payHTML}
      </div>
      ${ev.imageUrl?`<div class="poster-wrap"><p class="poster-label">🖼️ מודעת האירוע</p><div class="poster-thumb" id="poster-thumb"><img src="${ev.imageUrl}" alt="מודעת ${ev.title}"></div></div>`:''}`;

    modalBg.classList.add('active'); modalSheet.classList.add('active');
    document.body.style.overflow = 'hidden';
    startCd(d, closed);

    const ia=document.getElementById('ia'), ic=document.getElementById('ic'), tot=document.getElementById('tot');
    const calc=()=>tot.textContent=(parseInt(ia.value)||0)*(ev.priceAdult||0)+(parseInt(ic.value)||0)*(ev.priceChild||0);
    document.getElementById('ia2').onclick=()=>{ia.value=(parseInt(ia.value)||0)+1;calc()};
    document.getElementById('da').onclick =()=>{if(ia.value>0){ia.value--;calc()}};
    document.getElementById('ic2').onclick=()=>{ic.value=(parseInt(ic.value)||0)+1;calc()};
    document.getElementById('dc').onclick =()=>{if(ic.value>0){ic.value--;calc()}};

    const thumb=document.getElementById('poster-thumb');
    if(thumb) thumb.onclick=()=>openLb(ev.imageUrl);
    document.getElementById('btn-close').onclick=closeModal;
    modalBg.onclick=closeModal;
  }

  function closeModal(){
    modalBg.classList.remove('active'); modalSheet.classList.remove('active');
    document.body.style.overflow=''; clearInterval(cdInterval);
  }

  const pad=n=>String(n).padStart(2,'0');

  function startCd(d, closed) {
    const inner=document.getElementById('cd-inner');
    if (!d||isNaN(d)){inner.innerHTML='<p style="color:var(--text-soft);font-size:.88rem;text-align:center">לא הוגדר מועד סיום</p>';return}
    if (closed){inner.innerHTML='<div class="cd-closed">⛔ ההרשמה לאירוע נסגרה</div>';return}
    function tick(){
      const diff=d-new Date();
      if(diff<=0){
        inner.innerHTML='<div class="cd-closed">⛔ ההרשמה לאירוע נסגרה</div>';
        document.querySelectorAll('.btn-pay').forEach(b=>b.classList.add('disabled'));
        clearInterval(cdInterval);return;
      }
      const days=Math.floor(diff/86400000),hrs=Math.floor((diff%86400000)/3600000),mins=Math.floor((diff%3600000)/60000),secs=Math.floor((diff%60000)/1000);
      inner.innerHTML=`<div class="cd-timer"><div class="cd-unit"><span class="cd-num">${pad(days)}</span><span class="cd-word">ימים</span></div><span class="cd-sep">:</span><div class="cd-unit"><span class="cd-num">${pad(hrs)}</span><span class="cd-word">שעות</span></div><span class="cd-sep">:</span><div class="cd-unit"><span class="cd-num">${pad(mins)}</span><span class="cd-word">דקות</span></div><span class="cd-sep">:</span><div class="cd-unit"><span class="cd-num">${pad(secs)}</span><span class="cd-word">שניות</span></div></div>`;
    }
    tick(); cdInterval=setInterval(tick,1000);
  }

  function openLb(url){lbImg.src=url;lightbox.classList.add('active')}
  document.getElementById('lb-close').onclick=()=>lightbox.classList.remove('active');
  lightbox.onclick=e=>{if(e.target===lightbox)lightbox.classList.remove('active')};

  await Promise.all([loadSettings(), loadEvents()]);
</script>

<script>
  function showPage(name, btn) {
    document.getElementById('cat-bar').style.display = (name==='events')?'':'none';
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('page-'+name).classList.add('active');
    document.querySelectorAll('.nav-link[data-page]').forEach(l=>l.classList.toggle('active',l.dataset.page===name));
    window.scrollTo({top:0,behavior:'smooth'});
  }
  const burger=document.getElementById('nav-burger'), drawer=document.getElementById('nav-drawer');
  burger.addEventListener('click',()=>{burger.classList.toggle('open');drawer.classList.toggle('open')});
  function closeDrawer(){burger.classList.remove('open');drawer.classList.remove('open')}
</script>
</body>
</html>
