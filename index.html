<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>גרעין אהל שלמה – אירועים קהילתיים</title>
  <meta name="description" content="אירועים ופעילויות של גרעין אהל שלמה – מאמינים קהילה">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&family=Frank+Ruhl+Libre:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --black:      #0A0705;
      --brown-dark: #4A2010;
      --brown-mid:  #7B3F1A;
      --brown-warm: #B8621E;
      --gold:       #C8882A;
      --gold-light: #D4A054;
      --sand:       #E8C080;
      --sand-light: #F0D4A0;
      --cream:      #FAF0DC;
      --white:      #FFFDF8;
      --gradient-desert: linear-gradient(135deg, #4A2010 0%, #B8621E 40%, #C8882A 70%, #E8C080 100%);
      --gradient-overlay: linear-gradient(180deg, rgba(10,7,5,0.2) 0%, rgba(74,32,16,0.65) 55%, rgba(10,7,5,0.97) 100%);
      --shadow-warm: 0 8px 32px rgba(120,60,20,0.35);
      --radius-card: 18px;
      --radius-btn:  50px;
      --font-display: 'Frank Ruhl Libre', serif;
      --font-body:    'Heebo', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { direction: rtl; scroll-behavior: smooth; }
    body {
      background: var(--black); color: var(--cream);
      font-family: var(--font-body); font-size: 16px; line-height: 1.7;
      min-height: 100vh; overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--black); }
    ::-webkit-scrollbar-thumb { background: var(--brown-warm); border-radius: 3px; }

    /* ── NAVBAR ── */
    .navbar {
      position: fixed; top: 0; right: 0; left: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 32px;
      background: rgba(10,7,5,0.88); backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(200,136,42,0.2);
    }
    .navbar-brand { display: flex; align-items: center; gap: 14px; text-decoration: none; }
    .navbar-logo-svg { width: 52px; height: 52px; flex-shrink: 0; }
    .navbar-title { font-family: var(--font-display); font-size: 1.1rem; color: var(--sand); line-height: 1.3; }
    .navbar-title small { display: block; font-size: 0.72rem; color: var(--gold-light); font-family: var(--font-body); font-weight: 300; letter-spacing: 0.5px; }

    /* ── HERO ── */
    .hero {
      min-height: 50vh; display: flex; align-items: flex-end; justify-content: center;
      padding: 120px 24px 60px; position: relative;
      background: var(--gradient-desert); overflow: hidden;
    }
    .hero::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 120px;
      background: linear-gradient(to bottom, transparent, var(--black));
      pointer-events: none;
    }
    .hero-dunes {
      position: absolute; inset: 0; opacity: 0.35;
      background:
        radial-gradient(ellipse 80% 60% at 20% 80%, #4A2010 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%, #7B3F1A 0%, transparent 55%);
    }
    .hero-content { position: relative; text-align: center; max-width: 680px; z-index: 1; }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 0.76rem; letter-spacing: 3px; color: var(--sand);
      background: rgba(10,7,5,0.45); border: 1px solid rgba(232,192,128,0.35);
      padding: 6px 20px; border-radius: var(--radius-btn); margin-bottom: 20px;
      text-transform: uppercase;
    }
    .hero-title {
      font-family: var(--font-display); font-size: clamp(2.2rem, 6vw, 3.8rem);
      font-weight: 900; color: var(--white); line-height: 1.15;
      text-shadow: 0 4px 24px rgba(10,7,5,0.6); margin-bottom: 14px;
    }
    .hero-sub { color: var(--sand-light); font-size: 1rem; font-weight: 300; }

    /* ── EVENTS SECTION ── */
    .events-section { padding: 60px 24px 80px; max-width: 1200px; margin: 0 auto; }
    .section-header {
      display: flex; align-items: baseline; gap: 14px;
      margin-bottom: 36px; padding-bottom: 18px;
      border-bottom: 1px solid rgba(200,136,42,0.18);
    }
    .section-title { font-family: var(--font-display); font-size: 1.9rem; font-weight: 700; color: var(--sand); }
    .events-count {
      font-size: 0.82rem; color: var(--gold-light);
      background: rgba(200,136,42,0.13); border: 1px solid rgba(200,136,42,0.28);
      padding: 3px 12px; border-radius: 20px;
    }
    .events-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 26px;
    }

    /* ── EVENT CARD ── */
    .event-card {
      background: rgba(28,13,6,0.85); border: 1px solid rgba(200,136,42,0.16);
      border-radius: var(--radius-card); overflow: hidden; cursor: pointer;
      transition: transform 0.35s cubic-bezier(.22,.68,0,1.2), box-shadow 0.35s, border-color 0.3s;
      position: relative;
    }
    .event-card:hover {
      transform: translateY(-8px) scale(1.01);
      box-shadow: var(--shadow-warm); border-color: rgba(200,136,42,0.48);
    }
    .card-img-wrap { overflow: hidden; height: 210px; background: var(--gradient-desert); position: relative; }
    .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s; }
    .event-card:hover .card-img-wrap img { transform: scale(1.06); }
    .card-img-placeholder {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; opacity: 0.45;
    }
    .card-body { padding: 22px 22px 20px; }
    .card-tag {
      display: inline-block; font-size: 0.7rem; letter-spacing: 2px; color: var(--gold);
      background: rgba(200,136,42,0.1); border: 1px solid rgba(200,136,42,0.28);
      padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; text-transform: uppercase;
    }
    .card-title { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; color: var(--cream); line-height: 1.3; margin-bottom: 9px; }
    .card-desc {
      font-size: 0.87rem; color: rgba(240,212,160,0.68); line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 16px;
    }
    .card-meta {
      display: flex; gap: 14px; flex-wrap: wrap; padding-top: 14px;
      border-top: 1px solid rgba(200,136,42,0.13);
    }
    .card-meta-item { display: flex; align-items: center; gap: 5px; font-size: 0.8rem; color: var(--gold-light); }
    .card-closed { position: absolute; top: 12px; left: 12px; background: rgba(10,7,5,0.88); color: #e07070; font-size: 0.72rem; border: 1px solid rgba(220,100,100,0.38); padding: 4px 12px; border-radius: 20px; }

    /* ── EMPTY / LOADER ── */
    .empty-state { grid-column:1/-1; text-align:center; padding:80px 20px; color:var(--gold-light); opacity:0.55; }
    .loader { display:flex; align-items:center; justify-content:center; min-height:280px; gap:10px; }
    .loader-dot { width:10px; height:10px; border-radius:50%; background:var(--gold); animation:dotPulse 1.2s ease-in-out infinite; }
    .loader-dot:nth-child(2) { animation-delay:.2s; background:var(--sand); }
    .loader-dot:nth-child(3) { animation-delay:.4s; background:var(--gold-light); }
    @keyframes dotPulse { 0%,80%,100%{transform:scale(.6);opacity:.4} 40%{transform:scale(1.1);opacity:1} }

    /* ── MODAL OVERLAY ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(10,7,5,0.97);
      display: flex; align-items: flex-start; justify-content: center;
      overflow-y: auto; opacity: 0; pointer-events: none;
      transition: opacity 0.32s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }

    /* ── EVENT DETAIL ── */
    .event-detail {
      width: 100%; max-width: 800px; margin: 0 auto; padding-bottom: 80px;
      transform: translateY(28px); transition: transform 0.38s cubic-bezier(.22,.68,0,1.2);
    }
    .modal-overlay.active .event-detail { transform: translateY(0); }

    .detail-hero { height: 400px; position: relative; overflow: hidden; }
    .detail-hero img { width:100%; height:100%; object-fit:cover; filter:blur(1px) brightness(0.45) saturate(1.4); transform:scale(1.07); }
    .detail-hero-plain { height:400px; background:var(--gradient-desert); }
    .detail-overlay {
      position:absolute; inset:0; background:var(--gradient-overlay);
      display:flex; flex-direction:column; justify-content:flex-end; padding:44px 40px;
    }
    .detail-title { font-family:var(--font-display); font-size:clamp(1.8rem,4vw,2.8rem); font-weight:900; color:var(--white); line-height:1.2; margin-bottom:12px; text-shadow:0 3px 18px rgba(10,7,5,0.8); }
    .detail-meta { display:flex; gap:18px; flex-wrap:wrap; }
    .detail-meta-item { display:flex; align-items:center; gap:7px; font-size:0.88rem; color:var(--sand-light); }

    .detail-body { padding: 36px 40px 0; }
    .detail-desc { font-size:1rem; color:rgba(250,240,220,0.82); line-height:1.88; margin-bottom:34px; white-space:pre-wrap; }

    /* ── COUNTDOWN ── */
    .countdown-box {
      background: rgba(74,32,16,0.22); border: 1px solid rgba(200,136,42,0.22);
      border-radius: 14px; padding: 24px 28px; margin-bottom: 30px;
    }
    .countdown-label { font-size:0.8rem; letter-spacing:2px; color:var(--gold-light); text-transform:uppercase; margin-bottom:16px; }
    .countdown-timer { display:flex; gap:18px; justify-content:center; flex-wrap:wrap; }
    .countdown-unit { text-align:center; }
    .countdown-num {
      display:block; font-family:var(--font-display); font-size:2.6rem; font-weight:700; color:var(--sand); line-height:1;
      background:rgba(10,7,5,0.5); border:1px solid rgba(200,136,42,0.28); border-radius:10px; padding:10px 18px; min-width:72px;
    }
    .countdown-word { display:block; font-size:0.7rem; color:var(--gold-light); margin-top:6px; letter-spacing:1px; }
    .countdown-sep { font-size:2rem; color:var(--gold); align-self:center; line-height:1; margin-top:-8px; }
    .countdown-closed {
      text-align:center; color:#e07070; font-size:1rem; font-weight:500;
      padding:14px; background:rgba(220,70,70,0.09); border-radius:10px; border:1px solid rgba(220,70,70,0.22);
    }

    /* ── CALCULATOR ── */
    .calc-box {
      background: rgba(28,13,6,0.55); border: 1px solid rgba(200,136,42,0.18);
      border-radius: 14px; padding: 28px; margin-bottom: 26px;
    }
    .calc-title { font-family:var(--font-display); font-size:1.12rem; font-weight:700; color:var(--sand); margin-bottom:20px; }
    .calc-row { display:flex; gap:16px; margin-bottom:16px; flex-wrap:wrap; }
    .calc-field { flex:1; min-width:140px; }
    .calc-field label { display:block; font-size:0.8rem; color:var(--gold-light); margin-bottom:8px; }
    .calc-field-row { display:flex; align-items:center; }
    .calc-btn {
      background:rgba(200,136,42,0.18); border:1px solid rgba(200,136,42,0.38); color:var(--gold);
      font-size:1.2rem; width:40px; height:44px; cursor:pointer; transition:background 0.2s; flex-shrink:0;
      font-family:var(--font-body);
    }
    .calc-btn:first-child { border-radius:8px 0 0 8px; }
    .calc-btn:last-child  { border-radius:0 8px 8px 0; }
    .calc-btn:hover { background:rgba(200,136,42,0.38); }
    .calc-input {
      width:60px; height:44px; text-align:center;
      background:rgba(10,7,5,0.6); border:1px solid rgba(200,136,42,0.28);
      border-right:none; border-left:none; color:var(--cream); font-size:1.05rem; font-family:var(--font-body); outline:none;
    }
    .calc-total {
      border-top:1px solid rgba(200,136,42,0.18); padding-top:18px; margin-top:4px;
      display:flex; align-items:baseline; justify-content:space-between;
    }
    .calc-total-label { font-size:0.9rem; color:var(--gold-light); }
    .calc-total-amount { font-family:var(--font-display); font-size:2rem; font-weight:700; color:var(--sand); }

    /* ── PAY BUTTON ── */
    .btn-pay {
      display:flex; align-items:center; justify-content:center; gap:10px;
      width:100%; padding:18px 32px; background:var(--gradient-desert);
      color:var(--black); font-family:var(--font-body); font-size:1.08rem; font-weight:700;
      border:none; border-radius:var(--radius-btn); cursor:pointer; text-decoration:none;
      transition:all 0.3s; box-shadow:0 6px 28px rgba(200,136,42,0.42); margin-bottom:26px;
      position:relative; overflow:hidden;
    }
    .btn-pay:hover { transform:translateY(-2px); box-shadow:0 10px 36px rgba(200,136,42,0.6); }
    .btn-pay.disabled, .btn-pay:disabled {
      background:rgba(80,60,40,0.38); color:rgba(200,180,150,0.38);
      cursor:not-allowed; box-shadow:none; transform:none; pointer-events:none;
    }

    /* ── POSTER ── */
    .poster-section { padding:0 40px 36px; }
    .poster-label { font-size:0.78rem; color:var(--gold-light); letter-spacing:2px; margin-bottom:12px; text-transform:uppercase; }
    .poster-thumb {
      border-radius:12px; overflow:hidden; border:1px solid rgba(200,136,42,0.22);
      cursor:zoom-in; transition:transform 0.3s, border-color 0.3s;
    }
    .poster-thumb:hover { transform:scale(1.01); border-color:rgba(200,136,42,0.52); }
    .poster-thumb img { width:100%; display:block; }

    /* ── LIGHTBOX ── */
    .lightbox {
      position:fixed; inset:0; z-index:400; background:rgba(10,7,5,0.97);
      display:flex; align-items:center; justify-content:center;
      opacity:0; pointer-events:none; transition:opacity 0.28s;
    }
    .lightbox.active { opacity:1; pointer-events:all; }
    .lightbox img { max-width:94vw; max-height:92vh; border-radius:12px; object-fit:contain; }
    .lightbox-close {
      position:absolute; top:20px; left:20px;
      background:rgba(200,136,42,0.18); border:1px solid rgba(200,136,42,0.38);
      color:var(--cream); font-size:1.3rem; width:44px; height:44px;
      border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 0.2s;
    }
    .lightbox-close:hover { background:rgba(200,136,42,0.38); }

    /* ── BACK BUTTON ── */
    .btn-back {
      position:fixed; top:82px; right:22px; z-index:300;
      background:rgba(10,7,5,0.88); border:1px solid rgba(200,136,42,0.32);
      color:var(--gold-light); font-size:0.86rem; font-family:var(--font-body);
      padding:10px 20px; border-radius:var(--radius-btn); cursor:pointer;
      display:flex; align-items:center; gap:8px; backdrop-filter:blur(14px); transition:all 0.25s;
    }
    .btn-back:hover { background:rgba(74,32,16,0.8); color:var(--sand); border-color:rgba(200,136,42,0.58); }

    /* ── TOAST ── */
    .toast {
      position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(80px);
      background:rgba(28,13,6,0.96); border:1px solid rgba(200,136,42,0.38);
      color:var(--cream); font-size:0.9rem; padding:14px 28px;
      border-radius:var(--radius-btn); z-index:500;
      transition:transform 0.35s cubic-bezier(.22,.68,0,1.2);
      white-space:nowrap; backdrop-filter:blur(16px);
    }
    .toast.show { transform:translateX(-50%) translateY(0); }

    /* ── FOOTER ── */
    footer {
      text-align:center; padding:28px 24px;
      border-top:1px solid rgba(200,136,42,0.1);
      color:rgba(200,150,80,0.42); font-size:0.8rem;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .navbar { padding:12px 16px; }
      .detail-overlay { padding:22px 20px; }
      .detail-body, .poster-section { padding-left:20px; padding-right:20px; }
      .countdown-num { font-size:1.7rem; min-width:52px; padding:8px 10px; }
      .events-grid { grid-template-columns:1fr; }
      .hero { padding:100px 16px 48px; }
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a class="navbar-brand" href="#" aria-label="דף הבית">

<!-- HERO -->
<header class="hero">
  <div class="hero-dunes"></div>
  <div class="hero-content">

<main class="events-section">

  import { getAnalytics }   from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
  import { getFirestore, collection, getDocs, query, orderBy }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  /* ── Firebase config ── */
  const firebaseConfig = {
    apiKey:            "AIzaSyDXfQR-0pI5uRsSQpwPJ0u3uwJE2paYdEY",
    authDomain:        "osevents-4fbd2.firebaseapp.com",
    projectId:         "osevents-4fbd2",
    storageBucket:     "osevents-4fbd2.firebasestorage.app",
    messagingSenderId: "1094502920714",
    appId:             "1:1094502920714:web:35c52532d635e2353c25f3",
    measurementId:     "G-18Z8BFWKH9"
  };
  const app       = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const db        = getFirestore(app);

  /* ── DOM ── */
  const eventsGrid   = document.getElementById('events-grid');
  const eventsCount  = document.getElementById('events-count');
  const modalOverlay = document.getElementById('modal-overlay');
  const detailEl     = document.getElementById('event-detail');
  const lightbox     = document.getElementById('lightbox');
  const lightboxImg  = document.getElementById('lightbox-img');
  const toastEl      = document.getElementById('toast');

  let allEvents = [];
  let cdInterval = null;

  /* ══════════════════════════════
     1. LOAD EVENTS
  ══════════════════════════════ */
  async function loadEvents() {
    eventsGrid.innerHTML = `<div class="loader"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div>`;
    try {
      const q    = query(collection(db, 'events'), orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      allEvents  = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderCards();
    } catch(e) {
      eventsGrid.innerHTML = `<div class="empty-state"><p>שגיאה בטעינת האירועים. בדוק חיבור ונסה שוב.</p></div>`;
      console.error(e);
    }
  }

  /* ══════════════════════════════
     2. RENDER CARDS
  ══════════════════════════════ */
  function deadline(ev) {
    if (!ev.registrationDeadline) return null;
    return ev.registrationDeadline?.toDate ? ev.registrationDeadline.toDate() : new Date(ev.registrationDeadline);
  }
  function isClosed(ev) {
    const d = deadline(ev);
    return d && !isNaN(d) && d <= new Date();
  }

  function renderCards() {
    eventsCount.textContent = allEvents.length;
    if (!allEvents.length) {
      eventsGrid.innerHTML = `<div class="empty-state">
        <svg width="56" height="56" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="margin-bottom:14px;opacity:.4"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <p>אין אירועים כרגע. חכו לעדכונים!</p></div>`;
      return;
    }
    eventsGrid.innerHTML = allEvents.map(ev => {
      const d = deadline(ev);
      const dateStr = d && !isNaN(d) ? d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'}) : '';
      const closed  = isClosed(ev);
      return `
      <article class="event-card" data-id="${ev.id}" role="button" tabindex="0">
        ${closed ? '<span class="card-closed">ההרשמה נסגרה</span>' : ''}
        <div class="card-img-wrap">
          ${ev.imageUrl
            ? `<img src="${ev.imageUrl}" alt="${ev.title}" loading="lazy">`
            : `<div class="card-img-placeholder"><svg width="48" height="48" fill="none" viewBox="0 0 24 24" stroke="rgba(200,136,42,.5)"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></div>`}
        </div>
        <div class="card-body">
          <span class="card-tag">אירוע קהילתי</span>
          <h3 class="card-title">${ev.title}</h3>
          <p class="card-desc">${ev.description || ''}</p>
          <div class="card-meta">
            ${dateStr ? `<span class="card-meta-item"><svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>${dateStr}</span>` : ''}
            <span class="card-meta-item"><svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>מבוגר ₪${ev.priceAdult||0} | ילד ₪${ev.priceChild||0}</span>
          </div>
        </div>
      </article>`;
    }).join('');

    eventsGrid.querySelectorAll('.event-card').forEach(c =>
      c.addEventListener('click', () => openDetail(c.dataset.id))
    );
  }

  /* ══════════════════════════════
     3. DETAIL VIEW
  ══════════════════════════════ */
  function openDetail(id) {
    const ev = allEvents.find(e => e.id === id);
    if (!ev) return;
    clearInterval(cdInterval);
    const d = deadline(ev);

    detailEl.innerHTML = `
      <button class="btn-back" id="btn-back">
        <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        חזרה לאירועים
      </button>

      <div class="detail-hero">
        ${ev.imageUrl ? `<img src="${ev.imageUrl}" alt="${ev.title}">` : '<div class="detail-hero-plain"></div>'}
        <div class="detail-overlay">
          <h1 class="detail-title">${ev.title}</h1>
          <div class="detail-meta">
            ${d && !isNaN(d) ? `<span class="detail-meta-item"><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>הרשמה עד ${d.toLocaleDateString('he-IL')}</span>` : ''}
            <span class="detail-meta-item"><svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>מבוגר ₪${ev.priceAdult||0} | ילד ₪${ev.priceChild||0}</span>
          </div>
        </div>
      </div>

      <div class="detail-body">
        ${ev.description ? `<p class="detail-desc">${ev.description}</p>` : ''}

        <div class="countdown-box">
          <div class="countdown-label">⏳ זמן שנותר להרשמה</div>
          <div id="cd-inner"></div>
        </div>

        <div class="calc-box">
          <h3 class="calc-title">🧮 מחשבון מחיר</h3>
          <div class="calc-row">
            <div class="calc-field">
              <label>מבוגרים (₪${ev.priceAdult||0} לאדם)</label>
              <div class="calc-field-row">
                <button class="calc-btn" id="dec-a">−</button>
                <input class="calc-input" id="in-a" type="number" value="0" min="0" readonly>
                <button class="calc-btn" id="inc-a">+</button>
              </div>
            </div>
            <div class="calc-field">
              <label>ילדים (₪${ev.priceChild||0} לילד)</label>
              <div class="calc-field-row">
                <button class="calc-btn" id="dec-c">−</button>
                <input class="calc-input" id="in-c" type="number" value="0" min="0" readonly>
                <button class="calc-btn" id="inc-c">+</button>
              </div>
            </div>
          </div>
          <div class="calc-total">
            <span class="calc-total-label">סה"כ לתשלום</span>
            <span class="calc-total-amount">₪<span id="total-num">0</span></span>
          </div>
        </div>

        ${ev.paymentLink ? `
        <a class="btn-pay" id="btn-pay" href="${ev.paymentLink}" target="_blank" rel="noopener noreferrer">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
          לתשלום מאובטח
        </a>` : ''}
      </div>

      ${ev.imageUrl ? `
      <div class="poster-section">
        <p class="poster-label">🖼️ מודעת האירוע</p>
        <div class="poster-thumb" id="poster-thumb">
          <img src="${ev.imageUrl}" alt="מודעת ${ev.title}">
        </div>
      </div>` : ''}
    `;

    modalOverlay.classList.add('active');
    document.body.style.overflow = 'hidden';

    /* countdown */
    startCountdown(d);

    /* calculator */
    const inA = document.getElementById('in-a');
    const inC = document.getElementById('in-c');
    const tot = document.getElementById('total-num');
    const calc = () => tot.textContent = (parseInt(inA.value)||0)*(ev.priceAdult||0) + (parseInt(inC.value)||0)*(ev.priceChild||0);
    document.getElementById('inc-a').onclick = () => { inA.value = (parseInt(inA.value)||0)+1; calc(); };
    document.getElementById('dec-a').onclick = () => { if(inA.value>0){inA.value--;calc();} };
    document.getElementById('inc-c').onclick = () => { inC.value = (parseInt(inC.value)||0)+1; calc(); };
    document.getElementById('dec-c').onclick = () => { if(inC.value>0){inC.value--;calc();} };

    /* poster lightbox */
    const thumb = document.getElementById('poster-thumb');
    if (thumb && ev.imageUrl) thumb.onclick = () => openLightbox(ev.imageUrl);

    /* close */
    document.getElementById('btn-back').onclick = closeDetail;
    modalOverlay.onclick = e => { if(e.target===modalOverlay) closeDetail(); };
  }

  function closeDetail() {
    modalOverlay.classList.remove('active');
    document.body.style.overflow = '';
    clearInterval(cdInterval);
  }

  /* ══════════════════════════════
     4. COUNTDOWN
  ══════════════════════════════ */
  const pad = n => String(n).padStart(2,'0');

  function startCountdown(d) {
    const inner  = document.getElementById('cd-inner');
    const btnPay = document.getElementById('btn-pay');

    if (!d || isNaN(d)) {
      inner.innerHTML = '<p style="color:var(--gold-light);font-size:.9rem;text-align:center">לא הוגדר מועד סיום הרשמה</p>';
      return;
    }

    function tick() {
      const diff = d - new Date();
      if (diff <= 0) {
        inner.innerHTML = `<div class="countdown-closed">⛔ ההרשמה לאירוע נסגרה</div>`;
        if (btnPay) { btnPay.classList.add('disabled'); btnPay.setAttribute('aria-disabled','true'); }
        clearInterval(cdInterval);
        return;
      }
      const days  = Math.floor(diff/86400000);
      const hrs   = Math.floor((diff%86400000)/3600000);
      const mins  = Math.floor((diff%3600000)/60000);
      const secs  = Math.floor((diff%60000)/1000);
      inner.innerHTML = `
        <div class="countdown-timer">
          <div class="countdown-unit"><span class="countdown-num">${pad(days)}</span><span class="countdown-word">ימים</span></div>
          <span class="countdown-sep">:</span>
          <div class="countdown-unit"><span class="countdown-num">${pad(hrs)}</span><span class="countdown-word">שעות</span></div>
          <span class="countdown-sep">:</span>
          <div class="countdown-unit"><span class="countdown-num">${pad(mins)}</span><span class="countdown-word">דקות</span></div>
          <span class="countdown-sep">:</span>
          <div class="countdown-unit"><span class="countdown-num">${pad(secs)}</span><span class="countdown-word">שניות</span></div>
        </div>`;
    }
    tick();
    cdInterval = setInterval(tick, 1000);
  }

  /* ══════════════════════════════
     5. LIGHTBOX
  ══════════════════════════════ */
  function openLightbox(url) {
    lightboxImg.src = url;
    lightbox.classList.add('active');
  }
  document.getElementById('lightbox-close').onclick = () => lightbox.classList.remove('active');
  lightbox.onclick = e => { if(e.target===lightbox) lightbox.classList.remove('active'); };

  /* ── Boot ── */
  loadEvents();
</script>
</body>
</html>
